<p-card>
  <div class="header-table">
    <h2>Lista de miembros</h2>
    <button pButton icon="pi pi-plus" aria-label="Agregar" (click)="openAddDialog()"></button>
  </div>

  <p-table [value]="members" [tableStyle]="{ 'min-width': '40rem' }">
    <ng-template #header>
      <tr>
        <th>Codigo</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-member>
      <tr>
        <td>{{ member.id }}</td>
        <td>{{ member.name }}</td>
        <td>{{ member.email }}</td>
        <td>
          <div class="button-actions">
            <button pButton icon="pi pi-pencil" (click)="openEditDialog(member)"></button>
            <button pButton icon="pi pi-trash" severity="danger" (click)="confirmDelete(member)"></button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-dialog
  [header]="isEditMode ? 'Editar Miembro' : 'Agregar Miembro'"
  [modal]="true"
  [(visible)]="showDialog"
  [style]="{ width: '22rem' }">

  <form [formGroup]="memberForm" class="inputs-container">
    <div class="input-box">
      <label for="name">Nombre</label>
      <input pInputText id="name" formControlName="name" />
      <small *ngIf="memberForm.get('name')?.touched && memberForm.get('name')?.invalid" class="error">
        El nombre es obligatorio (mínimo 2 caracteres).
      </small>
    </div>

    <div class="input-box">
      <label for="email">Correo</label>
      <input pInputText id="email" formControlName="email" />
      <small *ngIf="memberForm.get('email')?.touched && memberForm.get('email')?.invalid" class="error">
        Debe ser un correo válido.
      </small>
    </div>

    <div class="button-box">
      <p-button label="Cancelar" severity="secondary" (click)="closeDialog()" />
      <p-button label="{{ isEditMode ? 'Actualizar' : 'Guardar' }}" (click)="saveMember()" />
    </div>
  </form>
</p-dialog>

<p-confirmDialog></p-confirmDialog>
<p-toast />
