<div class="dashboard-container">
  <div class="header">
    <p-button icon="pi pi-list" aria-label="Save" (onClick)="visible = true"/>
    <h1>Gestion de {{title}}</h1>
  </div>
  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>

<p-drawer [(visible)]="visible" header="Modulos">
  <div class="modules-container">
    <div class="module" routerLink="/dashboard/books" (click)="visible=false">
      <span class="pi pi-book"></span>
      <h2>Libros</h2>
    </div>
    <div class="module" routerLink="/dashboard/members" (click)="visible=false">
      <span class="pi pi-user"></span>
      <h2>Miembros</h2>
    </div>
    <div class="module" routerLink="/dashboard/loans" (click)="visible=false">
      <span class="pi pi-calendar-clock"></span>
      <h2>Prestamos</h2>
    </div>
    <div class="module" routerLink="/dashboard/statistics" (click)="visible=false">
      <span class="pi pi-chart-line"></span>
      <h2>Estadisticas</h2>
    </div>
  </div>
</p-drawer>
